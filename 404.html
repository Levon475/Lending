<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Էջը չի գտնվել — WhiteSmile</title>
    <link rel="stylesheet" href="main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Armenian:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        .error-page {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #ffffff;
            text-align: center;
            padding: 20px;
            font-family: 'Noto Sans Armenian', sans-serif;
        }
        .error-container {
            max-width: 500px;
        }
        .error-code {
            font-size: 120px;
            font-weight: 700;
            line-height: 1;
            color: #0ea5e9;
            margin-bottom: 10px;
        }
        .error-title {
            font-size: 28px;
            margin-bottom: 15px;
        }
        .error-text {
            font-size: 16px;
            opacity: 0.8;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .btn-back {
            display: inline-block;
            background-color: #0ea5e9;
            color: #ffffff;
            text-decoration: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-weight: 600;
            transition: background 0.3s;
        }
        .btn-back:hover {
            background-color: #0284c7;
        }
    </style>
</head>
<body>

    <section class="error-page">
        <div class="error-container">
            <div class="error-code">404</div>
            <h1 class="error-title">Ուփս․․․ Էջը չի գտնվել</h1>
            <p class="error-text">Հասցեն, որը դուք փնտրում եք, գոյություն չունի կամ տեղափոխվել է այլ վայր։</p>
            <a href="index.html" class="btn-back">Վերադառնալ Գլխավոր</a>
        </div>
    </section>

</body>
</html>
